{{ $item := .item }}
{{ $country := $item.Params.address.country | default "" }}
<li class="presentation-entry">
  <h2><a href="{{ $item.RelPermalink }}">{{ $item.Title }}</a></h2>
  <p class="presentation-event">{{ $item.Params.event }}</p>
  <p class="presentation-meta"><time datetime="{{ $item.Date.Format "2006-01-02" }}">{{ $item.Date.Format "Jan 2, 2006" }}</time> · {{ $item.Params.location }}{{ if and $country (ne $country $item.Params.location) }}, {{ $country }}{{ end }} · <a href="{{ $item.RelPermalink }}">Details</a></p>
</li>
